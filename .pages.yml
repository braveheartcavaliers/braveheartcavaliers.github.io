# Pages CMS setup for the Brave Heart website.
# Puppies and Reviews are lists; "Website text" holds the wording of every section of the page.

media:
- name: puppies
  label: Puppy photos
  input: images/puppies
  output: /images/puppies
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
- name: site
  label: Website photos
  input: images/site
  output: /images/site
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
- name: gallery
  label: Gallery photos
  input: images/gallery
  output: /images/gallery
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
content:
- name: puppies
  label: Puppies
  type: file
  path: data/puppies.json
  format: json
  list: true
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: status
    label: Status
    type: select
    required: true
    default: available
    description: Choose "Went home" instead of deleting, so the puppy shows in the "Recently went home" row.
    options:
      values:
      - name: available
        label: Available
      - name: reserved
        label: Reserved
      - name: went-home
        label: Went home
  - name: born
    label: Birth date
    type: date
    required: true
    description: The age on the website updates by itself.
    options:
      format: yyyy-MM-dd
  - name: price
    label: Price in USD
    type: number
    description: The full price, including the $1,000 deposit. Leave empty to show "Price on request".
  - name: sex
    label: Sex
    type: select
    options:
      values:
      - name: Female
        label: Female
      - name: Male
        label: Male
  - name: color
    label: Color
    type: select
    options:
      values:
      - name: Blenheim
        label: Blenheim
      - name: Tri-color
        label: Tri-color
  - name: photos
    label: Photos
    type: image
    description: Up to 6 photos. The first one is shown on the card.
    options:
      media: puppies
      multiple:
        max: 6
  - name: note
    label: Short note (optional)
    type: string
    description: One line for buyers, for example "Loves cuddles, great with kids".
- name: reviews
  label: Reviews
  type: file
  path: data/reviews.json
  format: json
  list: true
  fields:
  - name: name
    label: Name as shown (for example "Anna B.")
    type: string
    required: true
  - name: date
    label: Month and year (for example "May 2026")
    type: string
  - name: text
    label: Review
    type: text
    required: true
- name: gallery
  label: Gallery
  type: file
  path: data/gallery.json
  format: json
  list: true
  description: Photos shown when visitors open "Gallery" from the menu. Drag to change the order.
  fields:
  - name: photo
    label: Photo
    type: image
    required: true
    options:
      media: gallery
  - name: caption
    label: Caption (optional)
    type: string
    description: Shown when someone hovers over or opens the photo.
- name: website-text
  label: Website text
  type: group
  items:
  - name: home
    label: 1. Top of page
    type: file
    path: data/content/home.json
    format: json
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: intro
      label: Introduction
      type: text
    - name: buttonPuppies
      label: Button 1 text
      type: string
    - name: buttonApply
      label: Button 2 text
      type: string
    - name: photo
      label: Main photo
      type: image
      options:
        media: site
    - name: photoAlt
      label: Photo description
      type: string
      description: Describes the photo for people using screen readers and for Google.
    - name: quote
      label: Short review quote
      type: string
      description: Leave empty to hide the quote.
    - name: quoteAuthor
      label: Quote author
      type: string
    - name: stats
      label: Highlights bar
      type: object
      list: true
      description: Up to 4 works best. A value starting with a number (like "15 years") counts up when it appears.
      fields:
      - name: value
        label: Value
        type: string
        required: true
      - name: label
        label: Label
        type: string
  - name: puppies-section
    label: 2. Available puppies (section text)
    type: file
    path: data/content/puppies-section.json
    format: json
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: intro
      label: Introduction
      type: text
    - name: emptyText
      label: Message when no puppies are listed
      type: text
    - name: emptyPhoto
      label: Photo shown when no puppies are listed
      type: image
      options:
        media: site
    - name: emptyPhotoAlt
      label: Description of that photo
      type: string
    - name: goneTitle
      label: Heading for puppies that went home
      type: string
    - name: priceNote
      label: Price note
      type: text
  - name: about
    label: 3. Meet the breeder
    type: file
    path: data/content/about.json
    format: json
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: subtitle
      label: Line under the heading
      type: string
    - name: photo
      label: Main photo
      type: image
      description: The large photo beside the about text.
      options:
        media: site
    - name: photoAlt
      label: Main photo description
      type: string
    - name: photo2
      label: Second photo
      type: image
      description: The smaller photo that overlaps the main one.
      options:
        media: site
    - name: photo2Alt
      label: Second photo description
      type: string
    - name: text
      label: About text
      type: text
      description: Leave an empty line between paragraphs.
    - name: facts
      label: Quick facts
      type: object
      list: true
      fields:
      - name: label
        label: Label
        type: string
        required: true
      - name: value
        label: Value
        type: string
    - name: showTitle
      label: Show ring heading
      type: string
    - name: showText
      label: Show ring text
      type: text
    - name: dogs
      label: Featured dogs
      type: object
      list: true
      fields:
      - name: role
        label: Small label (for example "Our stud")
        type: string
      - name: name
        label: Name
        type: string
        required: true
      - name: wins
        label: Show wins
        type: string
        list: true
      - name: text
        label: Description
        type: text
  - name: health
    label: 4. Health
    type: file
    path: data/content/health.json
    format: json
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: intro
      label: Introduction
      type: text
    - name: badge
      label: Badge
      type: string
      description: Leave empty to hide it.
    - name: parentTitle
      label: Parent testing heading
      type: string
    - name: parentTests
      label: Parent tests
      type: object
      list: true
      fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: text
        label: Text
        type: text
    - name: puppyTitle
      label: Puppy items heading
      type: string
    - name: puppyItems
      label: What every puppy goes home with
      type: object
      list: true
      fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: text
        label: Text
        type: text
    - name: photo
      label: Socialization photo
      type: image
      description: The square photo in the "Raised to be confident" box.
      options:
        media: site
    - name: photoAlt
      label: Photo description
      type: string
    - name: raisedTitle
      label: Socialization heading
      type: string
    - name: raisedText
      label: Socialization text
      type: text
    - name: raisedChips
      label: Socialization tags
      type: string
      list: true
  - name: process
    label: 5. How it works
    type: file
    path: data/content/process.json
    format: json
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: intro
      label: Introduction
      type: text
    - name: steps
      label: Steps
      type: object
      list: true
      description: Four steps fit best.
      fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: text
        label: Text
        type: text
  - name: reviews-section
    label: 6. Reviews (section text)
    type: file
    path: data/content/reviews-section.json
    format: json
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: badge
      label: Badge
      type: string
    - name: sourceText
      label: Link text under the reviews
      type: string
  - name: contact
    label: 7. Contact
    type: file
    path: data/content/contact.json
    format: json
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: intro
      label: Introduction
      type: text
    - name: cards
      label: Contact cards
      type: object
      list: true
      description: The first card with an email address is also used for the application email link.
      fields:
      - name: who
        label: Name or label (for example "Eugene")
        type: string
      - name: value
        label: Phone number or email
        type: string
        required: true
      - name: how
        label: Note (for example "Text messages only")
        type: string
  - name: application
    label: 8. Application (messages and emails)
    type: file
    path: data/content/application.json
    format: json
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: intro
      label: Introduction
      type: text
    - name: privacyNote
      label: Privacy note
      type: text
      description: Shown beside the form and above the Submit button.
    - name: disclaimer
      label: Note beside the form
      type: text
    - name: thankYouTitle
      label: Thank-you heading
      type: string
    - name: thankYouText
      label: Thank-you text
      type: text
    - name: sentMessage
      label: Message after sending
      type: text
      description: Write {email} where the applicant's email address should appear.
    - name: fallbackMessage
      label: Message if sending fails
      type: text
    - name: confirmationSubject
      label: Confirmation email subject
      type: string
      description: The subject of the email the applicant receives.
    - name: confirmationText
      label: Confirmation email message
      type: text
      description: The opening of the email the applicant receives. A copy of their answers is added below it.
  - name: form
    label: 9. Application questions
    type: file
    path: data/content/form.json
    format: json
    fields:
    - name: sections
      label: Sections
      type: object
      list: true
      description: Each section is one step of the application. Drag to reorder.
      fields:
      - name: title
        label: Section heading
        type: string
        required: true
      - name: short
        label: Short name for the side menu
        type: string
        description: For example "Housing".
      - name: intro
        label: Line under the heading
        type: string
      - name: minutes
        label: Minutes to complete
        type: number
        description: Used for the "About X minutes left" estimate.
      - name: questions
        label: Questions
        type: object
        list: true
        fields:
        - name: label
          label: Question
          type: string
          required: true
        - name: type
          label: Answer type
          type: select
          default: text
          options:
            values:
            - name: text
              label: Short text
            - name: textarea
              label: Long text
            - name: choice
              label: Choose one (buttons)
            - name: dropdown
              label: Choose one (dropdown list)
            - name: number
              label: Number with + and − buttons
            - name: email
              label: Email address
            - name: phone
              label: Phone number
            - name: puppy
              label: Pick from available puppies
        - name: options
          label: Choices
          type: string
          list: true
          description: Only for "Choose one" questions. One choice per line.
        - name: required
          label: Required
          type: boolean
          default: true
        - name: width
          label: Width
          type: select
          default: full
          options:
            values:
            - name: full
              label: Full width
            - name: half
              label: Half width (two short questions side by side)
        - name: note
          label: Small hint next to the question
          type: string
        - name: placeholder
          label: Example text inside the empty box
          type: string
        - name: showIf
          label: Only show when (optional)
          type: string
          description: 'Show this question only after a certain answer. Write the other question''s ID, then = and the answer. Examples: ownRent = Rent, childCount > 0, fenced = No.'
        - name: min
          label: Lowest number
          type: number
          description: Only for number questions.
        - name: max
          label: Highest number
          type: number
          description: Only for number questions.
        - name: key
          label: Question ID
          type: string
          description: A short name with no spaces, used by "Only show when" and the Google Sheet. Leave empty on new questions and one is made from the question text. Do not change it on existing questions.
    - name: reviewTitle
      label: Review step heading
      type: string
    - name: reviewIntro
      label: Review step line under the heading
      type: string
    - name: finalQuestion
      label: Last question on the review step
      type: string
  - name: gallery-section
    label: 10. Gallery (heading)
    type: file
    path: data/content/gallery-section.json
    format: json
    fields:
    - name: eyebrow
      label: Small label above the heading
      type: string
    - name: title
      label: Heading
      type: string
    - name: intro
      label: Line under the heading
      type: string
  - name: footer
    label: 11. Footer
    type: file
    path: data/content/footer.json
    format: json
    fields:
    - name: tagline
      label: Short description
      type: text
    - name: bottomLine
      label: Bottom line (copyright)
      type: string
- name: settings
  label: Website settings
  type: file
  path: data/settings.json
  format: json
  fields:
  - name: applicationsUrl
    label: Application email service address
    type: string
    description: The Google Apps Script web app address that ends in /exec (see SETUP.md, step 5). Leave empty to turn off automatic emails.
